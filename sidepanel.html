<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>X PiP Feed Side Panel</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #e7e9ea;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
}
body::-webkit-scrollbar { width: 4px; }
body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.panel-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#f { flex: 1; min-height: 0; }
.t {
  padding: 10px 14px;
  border-bottom: 1px solid #2f3336;
  cursor: pointer;
  transition: background 0.15s;
}
.t:hover { background: #0a0a0a; }
.t.new {
  border-left: 3px solid #e0245e;
  background: rgba(224,36,94,0.08);
}
.t.last-batch {
  border-left: 3px solid #ff8a00;
  background: rgba(255,138,0,0.08);
}
.h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.a { color: #1d9bf0; font-weight: 700; font-size: 13px; }
.rt { color: #71767b; font-size: 11px; }
.rt-icon { color: #00ba7c; font-size: 11px; }
.ts { color: #71767b; font-size: 11px; margin-left: auto; }
.c { color: #71767b; font-size: 11px; font-variant-numeric: tabular-nums; margin-left: auto; }
.x {
  color: #e7e9ea;
  font-size: 13px;
  line-height: 1.4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.e { padding: 40px 14px; text-align: center; color: #71767b; }
</style>
</head>
<body data-surface="side-panel">
<div class="panel-shell">
  <div id="f"><div class="e">Loading feed...</div></div>
</div>
<script src="pip.js"></script>
</body>
</html>
