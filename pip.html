<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>X PiP</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #e7e9ea;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  overflow-y: auto;
}
body.launcher-mode {
  cursor: pointer;
}
body::-webkit-scrollbar { width: 4px; }
body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
#launcher {
  min-height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.launcher-card {
  width: 100%;
  max-width: 320px;
  background: linear-gradient(180deg, #111 0%, #090909 100%);
  border: 1px solid #2f3336;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
.launcher-title {
  color: #f7f9f9;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}
.launcher-copy {
  color: #8b98a5;
  font-size: 13px;
  line-height: 1.35;
  margin-bottom: 14px;
}
#pin-btn {
  width: 100%;
  border: 0;
  border-radius: 999px;
  background: #1d9bf0;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 12px 16px;
  cursor: pointer;
}
#pin-btn:disabled {
  opacity: 0.7;
  cursor: progress;
}
#f { min-height: 100vh; }
.t {
  padding: 10px 14px;
  border-bottom: 1px solid #2f3336;
  cursor: pointer;
  transition: background 0.15s;
}
.t:hover { background: #0a0a0a; }
.t.new { border-left: 3px solid #e0245e; background: rgba(224,36,94,0.08); }
.t.last-batch { border-left: 3px solid #ff8a00; background: rgba(255,138,0,0.08); }
.t.truth {
  background: #8fd2ff;
  border-bottom-color: rgba(0,0,0,0.12);
}
.t.truth:hover {
  background: #7bc8fb;
}
.t.truth.new {
  background: #72c0f3;
}
.t.truth.last-batch {
  background: #86cbf8;
}
.h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.a { color: #1d9bf0; font-weight: 700; font-size: 13px; }
.t.truth .a { color: #0a3d62; }
.rt { color: #71767b; font-size: 11px; }
.rt-icon { color: #00ba7c; font-size: 11px; }
.ts { color: #71767b; font-size: 11px; margin-left: auto; }
.c { color: #71767b; font-size: 11px; font-variant-numeric: tabular-nums; margin-left: auto; }
.x {
  color: #e7e9ea;
  font-size: 13px;
  line-height: 1.4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.t.truth .x,
.t.truth .rt,
.t.truth .ts,
.t.truth .c {
  color: #111;
}
.t.truth .rt-icon {
  color: #0a3d62;
}
.e { padding: 40px 14px; text-align: center; color: #71767b; }
</style>
</head>
<body>
<div id="launcher">
  <div class="launcher-card">
    <div class="launcher-title">Open Picture-in-Picture</div>
    <div class="launcher-copy">One click opens the floating feed and hides this launcher.</div>
    <button id="pin-btn" type="button">Open PiP</button>
  </div>
</div>
<div id="f"><div class="e">Loading feed...</div></div>
<script src="pip.js"></script>
</body>
</html>
